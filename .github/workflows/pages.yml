# The website (site/, see site/README.md): the guides from docs/ and the reference of the standard library, made from
# its doc comments by 'cshiftc doc', with the release that added each declaration ("since"). There is one version per
# major release, at /CShift/vN/, built from the newest release branch of that major version
# (.github/scripts/build-sites.sh); /CShift/ goes to the newest one.
#
# A successful release (release.yml) publishes the site again, and so does a manual run (workflow_dispatch). The
# publishing runs after the release workflow (workflow_run) rather than on the push to release/vX.XX: it then runs in
# the context of the default branch, which the github-pages environment allows to deploy. A pull request that touches
# the site only builds it, from its own branch.

name: pages

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "stdlib/**"
      - "selfhost/src/Driver/Doc.csh"
      - "selfhost/native/**"
      - "vscode-extension/syntaxes/**"
      - ".github/workflows/pages.yml"
      - ".github/scripts/build-sites.sh"
  workflow_dispatch:

env:
  LLVM_VERSION: "22" # keep in sync with ci.yml
  WASI_SDK: "25" # keep in sync with ci.yml

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

jobs:
  # pull requests: the site of the branch, as a check
  check:
    name: Build the site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    env:
      LLVM_PREFIX: /usr/lib/llvm-22 # keep in sync with LLVM_VERSION above
    steps:
      - uses: actions/checkout@v5

      - name: Install clang ${{ env.LLVM_VERSION }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          # the playground: the compiler as WebAssembly (site/scripts/playground.sh), with the sysroot of wasi-sdk;
          # the games page: libclang for the C headers of demo-opengl
          sudo apt-get install -y --no-install-recommends "libclang-rt-$LLVM_VERSION-dev-wasm32" "lld-$LLVM_VERSION" "libclang-$LLVM_VERSION-dev"
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK/wasi-sysroot-$WASI_SDK.0.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "CSHIFT_WASI_SYSROOT=$RUNNER_TEMP/wasi-sysroot-$WASI_SDK.0" >> "$GITHUB_ENV"
          test -x "$LLVM_PREFIX/bin/clang"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build cshiftc and the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$LLVM_PREFIX/bin:$PATH"
          git fetch -q origin 'refs/heads/release/*:refs/remotes/origin/release/*'
          STAGE0="$(bash selfhost/fetch-stage0.sh build/stage0)"
          "$STAGE0" build selfhost -O0 -o build/cshc
          bash site/scripts/history.sh "$PWD/build/cshc" "$PWD/build/history"
          bash site/scripts/playground.sh build/cshc
          cd site
          npm ci --no-audit --no-fund
          SITE_BRANCH="$GITHUB_BASE_REF" SITE_HISTORY="$GITHUB_WORKSPACE/build/history" \
            CSHIFTC="$GITHUB_WORKSPACE/build/cshc" npm run build

  # releases and manual runs: every major version, published
  build:
    name: Build the site (all versions)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release/v'))
    runs-on: ubuntu-22.04
    env:
      LLVM_PREFIX: /usr/lib/llvm-22 # keep in sync with LLVM_VERSION above
    steps:
      - uses: actions/checkout@v5

      - name: Install clang ${{ env.LLVM_VERSION }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          # the playground: the compiler as WebAssembly (site/scripts/playground.sh), with the sysroot of wasi-sdk;
          # the games page: libclang for the C headers of demo-opengl
          sudo apt-get install -y --no-install-recommends "libclang-rt-$LLVM_VERSION-dev-wasm32" "lld-$LLVM_VERSION" "libclang-$LLVM_VERSION-dev"
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK/wasi-sysroot-$WASI_SDK.0.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "CSHIFT_WASI_SYSROOT=$RUNNER_TEMP/wasi-sysroot-$WASI_SDK.0" >> "$GITHUB_ENV"
          test -x "$LLVM_PREFIX/bin/clang"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: PATH="$LLVM_PREFIX/bin:$PATH" bash .github/scripts/build-sites.sh "$RUNNER_TEMP/site"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
