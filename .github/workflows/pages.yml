# The website (site/, see site/README.md): the guides from docs/ and the reference of the standard library, made from
# its doc comments by 'cshiftc doc'. A successful release (release.yml) publishes the site of its branch on GitHub
# Pages; started by hand (workflow_dispatch) it publishes the branch it is started on. A pull request that touches the
# site only builds it. Before 1.0 there is one version of the site (the newest release).
#
# The publishing runs after the release workflow (workflow_run) rather than on the push to release/vX.XX: it then runs
# in the context of the default branch, which the github-pages environment allows to deploy.

name: pages

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "stdlib/**"
      - "selfhost/src/Driver/Doc.csh"
      - "vscode-extension/syntaxes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

env:
  LLVM_VERSION: "22" # keep in sync with ci.yml

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release/v'))
    runs-on: ubuntu-22.04
    env:
      LLVM_PREFIX: /usr/lib/llvm-22 # keep in sync with LLVM_VERSION above
      # the branch whose site is built: the released one, or the one of the pull request / the manual run
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install clang ${{ env.LLVM_VERSION }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          test -x "$LLVM_PREFIX/bin/clang"

      - name: Download stage 0 (an earlier release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "STAGE0=$(bash selfhost/fetch-stage0.sh build/stage0)" >> "$GITHUB_ENV"

      # the compiler of this commit (only stage 1: 'cshiftc doc' needs no bootstrap check), with the release's version
      - name: Build cshiftc
        run: |
          case "$SOURCE_BRANCH" in release/v*) printf '%s\n' "${SOURCE_BRANCH#release/v}" > selfhost/version/version.txt ;; esac
          PATH="$LLVM_PREFIX/bin:$PATH" "$STAGE0" build selfhost -O0 -o build/cshc
          build/cshc --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        env:
          SITE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || env.SOURCE_BRANCH }}
        run: |
          npm ci
          CSHIFTC="$GITHUB_WORKSPACE/build/cshc" npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
