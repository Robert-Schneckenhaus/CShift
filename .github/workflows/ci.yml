# Checks every pull request (and every push to master) on Windows and Linux: stage 0 (the release named in
# selfhost/stage0.txt) builds cshc, cshc rebuilds itself to the same IR (selfhost/build-release.sh), and the test suite
# passes with it. The release workflow (release.yml) does the same and then packages and publishes.
#
# The tests skip their section 4 (CSHIFT_SKIP_SELFHOST): it builds cshc from selfhost/ with the compiler under test and
# runs the cases, the projects and the bootstrap with it. Here the compiler under test is that cshc already (stage 2,
# built from these sources and checked to be a fixed point), so the section would only repeat sections 1 to 3 and the
# bootstrap with the same compiler. The release workflow keeps it.

name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  LLVM_VERSION: "22" # keep in sync with release.yml
  WASI_SDK: "25" # the sysroot of WebAssembly (wasi-sdk), keep in sync with pages.yml

permissions:
  contents: read # also: downloading the stage 0 release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MSYS2 CLANG64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-crt
            mingw-w64-clang-x86_64-headers
            mingw-w64-clang-x86_64-winpthreads
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-libunwind
            mingw-w64-clang-x86_64-compiler-rt

      - name: Download stage 0 (an earlier release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "STAGE0=$(bash selfhost/fetch-stage0.sh build/stage0)" >> "$GITHUB_ENV"

      - name: Build cshiftc (stages 1 and 2, bootstrap check)
        shell: msys2 {0}
        run: bash selfhost/build-release.sh "$STAGE0" dev build/stage2

      - name: Run tests
        shell: msys2 {0}
        run: CSHIFT_SKIP_SELFHOST=1 bash tests/run_tests.sh build/stage2/cshiftc.exe

  linux:
    name: Linux x64 (Ubuntu)
    runs-on: ubuntu-22.04
    env:
      LLVM_PREFIX: /usr/lib/llvm-22 # keep in sync with LLVM_VERSION above
    steps:
      - uses: actions/checkout@v5

      - name: Install clang and libclang ${{ env.LLVM_VERSION }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends "libclang-$LLVM_VERSION-dev" "clang-$LLVM_VERSION"
          test -x "$LLVM_PREFIX/bin/clang"

      - name: Download stage 0 (an earlier release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "STAGE0=$(bash selfhost/fetch-stage0.sh build/stage0)" >> "$GITHUB_ENV"

      - name: Build cshiftc (stages 1 and 2, bootstrap check)
        run: PATH="$LLVM_PREFIX/bin:$PATH" bash selfhost/build-release.sh "$STAGE0" dev build/stage2

      - name: Run tests
        run: PATH="$LLVM_PREFIX/bin:$PATH" CSHIFT_SKIP_SELFHOST=1 bash tests/run_tests.sh build/stage2/cshiftc

      # System.Ui with a real window: X11 (libX11 is loaded at run time) under a virtual X server
      - name: Open a window (X11, Xvfb)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libx11-6
          PATH="$LLVM_PREFIX/bin:$PATH" build/stage2/cshiftc tests/ui/window_smoke.csh -o "$RUNNER_TEMP/window_smoke"
          xvfb-run -a "$RUNNER_TEMP/window_smoke"

      # WebAssembly (wasm32-wasi): the same programs, run with node; needs the C library of WASI (the sysroot of
      # wasi-sdk: the wasi-libc package of Ubuntu 22.04 is from 2020 and fails a second rename), the builtins of
      # compiler-rt for wasm32, and wasm-ld (lld)
      - name: Run tests for WebAssembly
        run: |
          sudo apt-get install -y --no-install-recommends "libclang-rt-$LLVM_VERSION-dev-wasm32" "lld-$LLVM_VERSION"
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK/wasi-sysroot-$WASI_SDK.0.tar.gz" | tar xz -C "$RUNNER_TEMP"
          PATH="$LLVM_PREFIX/bin:$PATH" CSHIFT_WASI_SYSROOT="$RUNNER_TEMP/wasi-sysroot-$WASI_SDK.0" CSHIFT_TARGET=wasm32-wasi \
            CSHIFT_SKIP_SELFHOST=1 bash tests/run_tests.sh build/stage2/cshiftc

      # CShift's own WebAssembly backend (--backend wasm: no clang, no wasi-libc): the same programs, and the compiler
      # as WebAssembly must build itself
      - name: Run tests with the wasm backend
        run: CSHIFT_TARGET=wasm32-wasi CSHIFT_BACKEND=wasm CSHIFT_SKIP_SELFHOST=1 bash tests/run_tests.sh build/stage2/cshiftc

      # CShift's own 68000 backend (the one for the Amiga): the same programs for m68k Linux, linked by the cross gcc and
      # run under qemu-m68k
      - name: Run tests with the m68k backend
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user gcc-m68k-linux-gnu libc6-dev-m68k-cross
          CSHIFT_TARGET=m68k-linux-gnu CSHIFT_BACKEND=m68k CSHIFT_SKIP_SELFHOST=1 bash tests/run_tests.sh build/stage2/cshiftc

  vscode:
    name: VS Code extension (package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the same packaging as the release (release.yml), so an invalid package.json fails here and not in a release
      - name: Package the VS Code extension
        run: |
          cp LICENSE vscode-extension/LICENSE
          mkdir -p vscode-extension/debug && cp tools/debug/cshift_lldb.py vscode-extension/debug/   # lldb formatters for F5
          cd vscode-extension
          npx --yes @vscode/vsce package --allow-missing-repository -o "$RUNNER_TEMP/cshift-vscode.vsix"
