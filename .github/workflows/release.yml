# Builds cshiftc for Windows (x64) and Linux (Ubuntu, x64) and publishes a GitHub release.
#
# Trigger: a push to a branch named release/vX.XX (e.g. release/v1.05 -> version 1.05, tag v1.05).
# Every push to such a branch rebuilds the release and replaces it (the tag then points to the pushed commit).
#
# The released cshiftc is the self-hosted compiler (selfhost/, written in CShift). Stage 0 of the bootstrap is an earlier
# release (the version in selfhost/stage0.txt, downloaded by selfhost/fetch-stage0.sh): it builds cshc (stage 1), stage
# 1 builds cshc again (stage 2, the released cshiftc), and both stages must generate the same IR
# (selfhost/build-release.sh).
#
# The archives contain everything needed to work with the compiler: extract, add the folder to PATH, done.
#   cshift-<version>-windows-x64.zip                cshiftc.exe + toolchain\ (clang, lld, libclang, MinGW-w64 headers/libraries)
#   cshift-<version>-linux-x64.tar.xz               cshiftc + toolchain/ (clang, libclang); needs build-essential on the system
#
# Each platform also gets a standalone executable: the same toolchain embedded in one file (see
# packaging/make-standalone.sh), nothing to extract or add to PATH. It self-extracts into a per-user cache
# directory the first time it actually needs the toolchain (linking, or a C header import).
#   cshift-<version>-windows-x64-standalone.exe
#   cshift-<version>-linux-x64-standalone

name: release

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch: # re-run for the branch that is selected in the UI

env:
  LLVM_VERSION: "22" # LLVM/clang used on Linux (apt.llvm.org); Windows uses the current MSYS2 CLANG64 packages

permissions:
  contents: read # also: downloading the stage 0 release

# A newer push to the same release branch replaces a build that is still running.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          if [[ ! "$branch" =~ ^release/v([0-9]+(\.[0-9]+)+)$ ]]; then
            echo "::error::'$branch' is not a release branch. Expected release/vX.XX, e.g. release/v1.05"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Version: ${BASH_REMATCH[1]}"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MSYS2 CLANG64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-crt
            mingw-w64-clang-x86_64-headers
            mingw-w64-clang-x86_64-winpthreads
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-libunwind
            mingw-w64-clang-x86_64-compiler-rt

      - name: Download stage 0 (an earlier release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "STAGE0=$(bash selfhost/fetch-stage0.sh build/stage0)" >> "$GITHUB_ENV"

      - name: Build cshiftc (self-hosted, stage 2)
        shell: msys2 {0}
        run: bash selfhost/build-release.sh "$STAGE0" "$VERSION" build/stage2

      - name: Run tests
        shell: msys2 {0}
        run: bash tests/run_tests.sh build/stage2/cshiftc.exe

      - name: Assemble the release folder
        shell: msys2 {0}
        run: bash packaging/package-windows.sh "$VERSION" build/stage2 dist

      # The tests run again against the assembled folder with a PATH that contains neither MSYS2 nor clang, so a file
      # that is missing from the toolchain folder fails here and not on the user's machine.
      - name: Test the assembled folder
        shell: bash
        run: |
          dist="$PWD/dist/cshift-$VERSION-windows-x64"
          export PATH="/usr/bin:/c/Windows/System32:/c/Windows"
          export CSHIFT_CC="$dist/toolchain/bin/clang.exe"
          "$dist/cshiftc.exe" --version
          bash tests/run_tests.sh "$dist/cshiftc.exe"

      - name: Create the zip archive
        shell: pwsh
        run: |
          $name = "cshift-$env:VERSION-windows-x64"
          Push-Location dist
          7z a -tzip -mx=6 "$name.zip" "$name" | Select-Object -Last 3
          Pop-Location

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: dist/cshift-${{ needs.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create the standalone executable
        shell: bash
        run: bash packaging/make-standalone.sh "dist/cshift-$VERSION-windows-x64" "dist/cshift-$VERSION-windows-x64-standalone.exe"

      # A clean environment (no MSYS2, no clang, no PATH toolchain, no pre-existing cache): the very first
      # compile has to self-extract the embedded toolchain and then work exactly like the regular archive.
      # cshiftc.exe itself finds that extracted toolchain on its own (BundledClang in selfhost/src/Driver/Build.csh),
      # but two other things run during the test suite do not know about it and need clang locatable some other way:
      # tests/run_tests.sh's own compilation of tests/projects/*/native/*.c (CSHIFT_CC, or 'clang' on PATH), and the
      # cshc the selfhost section builds fresh (a plain executable without an embedded toolchain). A trivial warm-up
      # compile first makes cshiftc.exe self-extract (proving the real, unconfigured path works), then CSHIFT_CC is
      # pointed at the now-extracted clang for the rest of the run.
      - name: Test the standalone executable
        shell: bash
        run: |
          export PATH="/usr/bin:/c/Windows/System32:/c/Windows"
          export LOCALAPPDATA="$RUNNER_TEMP/standalone-cache"
          exe="$PWD/dist/cshift-$VERSION-windows-x64-standalone.exe"
          "$exe" --version

          printf 'void Main() {}\n' > "$RUNNER_TEMP/warmup.csh"
          "$exe" "$RUNNER_TEMP/warmup.csh" -o "$RUNNER_TEMP/warmup.exe"
          export CSHIFT_CC="$LOCALAPPDATA/cshift/toolchain-$VERSION/toolchain/bin/clang.exe"
          if [ ! -x "$CSHIFT_CC" ]; then
            echo "::error::the embedded toolchain did not self-extract to $CSHIFT_CC"
            exit 1
          fi

          bash tests/run_tests.sh "$exe"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64-standalone
          path: dist/cshift-${{ needs.version.outputs.version }}-windows-x64-standalone.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64 (Ubuntu)
    needs: version
    # The oldest supported runner: the binaries then also run on newer distributions (glibc is backwards compatible).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LLVM_PREFIX: /usr/lib/llvm-22 # keep in sync with LLVM_VERSION above
    steps:
      - uses: actions/checkout@v5

      - name: Install clang and libclang ${{ env.LLVM_VERSION }} (bundled into the release)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "libclang-$LLVM_VERSION-dev" "clang-$LLVM_VERSION" patchelf xz-utils
          test -x "$LLVM_PREFIX/bin/clang"

      - name: Download stage 0 (an earlier release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "STAGE0=$(bash selfhost/fetch-stage0.sh build/stage0)" >> "$GITHUB_ENV"

      - name: Build cshiftc (self-hosted, stage 2)
        run: PATH="$LLVM_PREFIX/bin:$PATH" bash selfhost/build-release.sh "$STAGE0" "$VERSION" build/stage2

      - name: Run tests
        run: PATH="$LLVM_PREFIX/bin:$PATH" bash tests/run_tests.sh build/stage2/cshiftc

      - name: Assemble the release folder
        run: bash packaging/package-linux.sh "$VERSION" build/stage2 dist

      # Again with the assembled folder only (no LLVM in PATH): cshiftc must find its own clang and libclang.
      - name: Test the assembled folder
        run: |
          dist="$PWD/dist/cshift-$VERSION-linux-x64"
          export PATH="/usr/bin:/bin"
          export CSHIFT_CC="$dist/toolchain/bin/clang"
          "$dist/cshiftc" --version
          bash tests/run_tests.sh "$dist/cshiftc"

      - name: Create the tar.xz archive
        run: |
          cd dist
          XZ_OPT="-T0 -6" tar -cJf "cshift-$VERSION-linux-x64.tar.xz" "cshift-$VERSION-linux-x64"
          ls -lh *.tar.xz

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: dist/cshift-${{ needs.version.outputs.version }}-linux-x64.tar.xz
          if-no-files-found: error
          retention-days: 7

      - name: Create the standalone executable
        run: bash packaging/make-standalone.sh "dist/cshift-$VERSION-linux-x64" "dist/cshift-$VERSION-linux-x64-standalone"

      # A clean environment (no LLVM in PATH, no pre-existing cache): the very first compile has to self-extract
      # the embedded toolchain and then work exactly like the regular archive (still needs build-essential, like
      # it does). See the Windows job's own "Test the standalone executable" step for why CSHIFT_CC is set after
      # a warm-up compile: cshiftc itself finds the self-extracted toolchain on its own, but tests/run_tests.sh's
      # native-C compilation and cshc (built fresh by the selfhost section) do not know about it.
      - name: Test the standalone executable
        run: |
          export PATH="/usr/bin:/bin"
          export XDG_CACHE_HOME="$RUNNER_TEMP/standalone-cache"
          exe="$PWD/dist/cshift-$VERSION-linux-x64-standalone"
          "$exe" --version

          printf 'void Main() {}\n' > "$RUNNER_TEMP/warmup.csh"
          "$exe" "$RUNNER_TEMP/warmup.csh" -o "$RUNNER_TEMP/warmup"
          export CSHIFT_CC="$XDG_CACHE_HOME/cshift/toolchain-$VERSION/toolchain/bin/clang"
          if [ ! -x "$CSHIFT_CC" ]; then
            echo "::error::the embedded toolchain did not self-extract to $CSHIFT_CC"
            exit 1
          fi

          bash tests/run_tests.sh "$exe"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-standalone
          path: dist/cshift-${{ needs.version.outputs.version }}-linux-x64-standalone
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true

      - name: Publish
        shell: bash
        run: |
          tag="v$VERSION"
          ls -lh assets
          cat > notes.md <<EOF
          CShift $VERSION

          | Platform | Archive |
          |---|---|
          | Windows 10/11, x64 | \`cshift-$VERSION-windows-x64.zip\` |
          | Linux (Ubuntu 22.04+ and other glibc distributions), x64 | \`cshift-$VERSION-linux-x64.tar.xz\` |

          Extract, add the folder to \`PATH\`, then \`cshiftc --version\` and \`cshiftc new hello\`.
          The archives contain the compiler and a matching clang/libclang toolchain (see README.txt in the archive).
          On Linux \`build-essential\` (gcc, libc6-dev, binutils) has to be installed.

          **Standalone, single-file alternative** (the same toolchain embedded in one executable - nothing to
          extract or add to \`PATH\`; it unpacks itself into a per-user cache directory the first time it is
          actually needed):

          | Platform | Executable |
          |---|---|
          | Windows 10/11, x64 | \`cshift-$VERSION-windows-x64-standalone.exe\` |
          | Linux (Ubuntu 22.04+ and other glibc distributions), x64 | \`cshift-$VERSION-linux-x64-standalone\` |

          Built from commit ${GITHUB_SHA} on branch \`${GITHUB_REF_NAME}\`.
          EOF

          # A new push to the release branch replaces the release of the same version (and moves its tag).
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$tag" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CShift $VERSION" \
            --notes-file notes.md
