<!doctype html>
<!-- A page for a CShift program from the wasm backend (cshiftc --backend wasm ... -o program.wasm): put it next to
     cshift.js and program.wasm and open it through a web server (python3 -m http.server). The query string can name
     another .wasm: index.html?wasm=game.wasm -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CShift</title>
    <style>
        body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
        canvas { background: #000; max-width: 100%; outline: none; image-rendering: pixelated; }
        pre { margin: 0; width: min(100%, 800px); max-height: 30vh; overflow: auto; white-space: pre-wrap; color: #aaa; }
        .error { color: #f77; }
    </style>
</head>
<body>
    <canvas id="screen" width="800" height="600"></canvas>
    <pre id="output"></pre>
    <script type="module">
        import { run } from "./cshift.js";

        const output = document.getElementById("output");
        const canvas = document.getElementById("screen");
        const print = (text, isError) => {
            const span = document.createElement("span");
            if (isError) span.className = "error";
            span.textContent = text;
            output.append(span);
        };
        const wasm = new URLSearchParams(location.search).get("wasm") ?? "program.wasm";
        try {
            const program = await run(wasm, { canvas, onOutput: print });
            canvas.focus();
            const code = await program.exited;
            print(`\n[exit code ${code}]\n`, code !== 0);
        } catch (e) {
            print(`${e.message ?? e}\n`, true);
        }
    </script>
</body>
</html>
